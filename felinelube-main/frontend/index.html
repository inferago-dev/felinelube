<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Optimization -->
    <title>Feline Genuine Lubricants — Engineered for Peak Performance</title>
    <meta name="description" content="Premium industrial-grade engine oils and lubricants formulated to exceed international standards. Discover the Feline range today." />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
      body { margin: 0; font-family: 'Inter', sans-serif; background: #000; color: #fff; }
      #initial-loader { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; background: #000; }
      .spinner { border: 4px solid rgba(255, 255, 255, 0.1); border-top: 4px solid #F5C518; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 20px; }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      .brand-wordmark { font-family: 'Poppins', sans-serif; font-size: 1.5rem; font-weight: 700; color: #fff; }
      .brand-wordmark span { color: #F5C518; }
    </style>
  </head>
  <body>
    <noscript>
      <div style="padding: 2rem; text-align: center; background: #222; color: #fff;">
        Please enable JavaScript to view this site.
      </div>
    </noscript>
    <div id="root">
      <div id="initial-loader">
        <div class="spinner"></div>
        <div class="brand-wordmark">FELINE <span>GENUINE LUBRICANTS</span></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
